name: Backfill (manual)

# Captura histórica a demanda, en los servidores de GitHub. Sirve para el
# primer llenado y para agregar estados o años después, sin ocupar tu equipo.
#
# Actions -> Backfill (manual) -> Run workflow, y llena los campos.
on:
  workflow_dispatch:
    inputs:
      estados:
        description: "Estados separados por COMA, o TODOS para el país completo (~1 h)."
        required: true
        default: "SONORA"
      regiones:
        description: "Regiones separadas por COMA, o TODAS."
        required: true
        default: "TODAS"
      desde:
        description: "Año inicial. CFE tiene histórico desde 2017."
        required: true
        default: "2017"
      hasta:
        description: "Año final. Vacío = el año en curso."
        required: false
        default: ""
      olvidar:
        description: "Regiones a borrar antes de capturar, separadas por COMA. Vacío = ninguna."
        required: false
        default: ""
      diagnostico:
        description: "Solo diagnóstico: inspecciona los desplegables y no captura nada."
        type: boolean
        default: false
      desplegar:
        description: "Desplegar la API al terminar."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    # El catálogo completo con pausa de 2 s puede pasar de una hora.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scraper/requirements.txt

      - name: Completar la cadena de certificados
        # El servidor de CFE no manda los intermedios; en Linux eso rompe la
        # verificación TLS. Esto los descarga y exporta REQUESTS_CA_BUNDLE.
        run: cd scraper && python3 preparar_tls.py --github-env

      - name: Verificar que el parser siga funcionando
        run: cd scraper && python3 test_parser.py && python3 test_catalogo.py

      - name: Diagnóstico de los desplegables
        if: inputs.diagnostico
        run: cd scraper && python3 diagnostico.py --pausa 2 --anio 2019 --mes 6

      - name: Construir catálogo
        if: '!inputs.diagnostico' 
        env:
          ESTADOS: ${{ inputs.estados }}
        run: |
          cd scraper
          # "TODOS" (o vacío) significa sin filtro: el país completo.
          if [ -z "$ESTADOS" ] || [ "$ESTADOS" = "TODOS" ]; then
            echo "Catálogo del país completo."
            python3 construir_catalogo.py --pausa 2
          else
            echo "Catálogo de: $ESTADOS"
            python3 construir_catalogo.py --pausa 2 --estados "$ESTADOS"
          fi

      - name: Capturar cargos
        if: '!inputs.diagnostico'
        env:
          REGIONES: ${{ inputs.regiones }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          OLVIDAR: ${{ inputs.olvidar }}
        run: |
          cd scraper
          # Array, no cadena: los nombres llevan espacios y una expansión sin
          # comillas los partiría en argumentos sueltos.
          ARGS=(--pausa 2 --desde "$DESDE")
          if [ -n "$HASTA" ]; then ARGS+=(--hasta "$HASTA"); fi
          if [ -n "$REGIONES" ] && [ "$REGIONES" != "TODAS" ]; then
            ARGS+=(--regiones "$REGIONES")
          fi
          if [ -n "$OLVIDAR" ]; then ARGS+=(--olvidar "$OLVIDAR"); fi
          echo "Ejecutando: actualizar_tarifas.py ${ARGS[@]}"
          python3 actualizar_tarifas.py "${ARGS[@]}"

      - name: Confirmar cambios
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "sin_cambios=1" >> "$GITHUB_OUTPUT"
            echo "No hubo datos nuevos."
            exit 0
          fi
          git commit -m "datos: backfill $(date -u +%Y-%m-%d)"

          # Mientras corría la captura alguien pudo empujar (tú, u otra
          # corrida). Se reintegra y se reintenta en vez de perder los datos,
          # que en el runner no sobreviven al final del job.
          for intento in 1 2 3; do
            if git push; then
              echo "Cambios publicados."
              exit 0
            fi
            echo "Push rechazado; reintegrando cambios remotos (intento $intento)."
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              echo "Conflicto al reintegrar. Revisa data/ a mano."
              exit 1
            fi
          done
          echo "No se pudo publicar tras 3 intentos."
          exit 1

      - name: Probar la API con los datos nuevos
        if: steps.commit.outputs.sin_cambios != '1'
        run: cd worker && npm install --no-audit --no-fund esbuild && node pruebas/prueba_api.mjs

      - name: Desplegar
        if: inputs.desplegar && steps.commit.outputs.sin_cambios != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
